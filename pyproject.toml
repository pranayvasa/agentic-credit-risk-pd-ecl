[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acr"
version = "0.1.0"
description = "Agent-orchestrated PD model, RBI ECL simulation and model-risk documentation on public Home Credit data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pranay Vasa" }]
dependencies = [
    "langgraph>=0.2",
    "pandas>=2.1",
    "pyarrow>=14",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.1",
    "optbinning>=0.19",
    "statsmodels>=0.14",
    "pydantic>=2.5",
    "pyyaml>=6",
    "python-dotenv>=1",
    "google-genai>=1.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.3"]
pdf = ["markdown>=3.5", "weasyprint>=60"]
dev = ["pytest>=8", "ruff>=0.5", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]

[project.scripts]
acr = "acr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is enforced by `ruff format`; long role strings are allowed
