# ILLUSTRATIVE ECL SIMULATION. Home Credit is an application-level dataset, not a live book.
# Regulatory parameters verified against the primary text:
#   Reserve Bank of India (Commercial Banks - Asset Classification, Provisioning and Income
#   Recognition) Directions, 2026. RBI/DOR/2026-27/398, DOR.STR.REC.No.6/21.06.011/2026-27,
#   dated 27 April 2026, effective 1 April 2027.
#   https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13400 (checked 2026-10-18)
regulation:
  reference: "RBI/DOR/2026-27/398"
  effective_date: "2027-04-01"

product_category: unsecured_retail     # para 82(3)(x)

book:
  # The pseudo-OOT partition is treated as a book at a simulated reporting date. Every loan
  # is assumed to be at origination (seasoning 0), so remaining term = contractual term.
  partition: oot
  seasoning_months: 0

term:
  # AMT_CREDIT and AMT_ANNUITY alone cannot identify both term and rate (one equation, two
  # unknowns). The monthly rate per contract type is the median rate implied by prior
  # approved Home Credit loans in previous_application (credit, annuity and CNT_PAYMENT are
  # all known there), using train customers only. Each loan's term is then solved from the
  # annuity formula at that rate. The same rate is the EIR used for discounting.
  rate_source: previous_application
  min_months: 3
  max_months: 120
  fallback_monthly_rate: 0.02          # used only if no prior loans of that type exist

revolving:
  # Para 46(2)(iii): for revolving facilities the bank determines the measurement period.
  life_months: 24                      # illustrative behavioural life
  ccf: 1.0                             # illustrative: limit treated as fully drawn (prudent)

lifetime:
  primary: constant_hazard             # constant_hazard | markov (both are always reported)
  markov_default_bucket: 4             # bureau_balance bucket 4+ = more than 90 DPD (absorbing)

pd:
  floor_12m: 0.0003                    # para 96: 12-month PD regulatory minimum 0.03%

lgd:
  base: 0.70                           # para 97: backstop LGD 70% on unsecured portion
  sensitivity: [0.45, 0.55, 0.70, 0.80]  # 0.45 is a Basel F-IRB-style comparison, not RBI base

staging:
  sicr_dpd_presumption: 30             # para 33: rebuttable presumption at >30 DPD
  credit_impaired_dpd: 90              # NPA definition retained (Chapter II)
  lookback_months: 12                  # illustrative; how far back prior-loan delinquency counts
  sicr_grade_notches: 3                # illustrative relative criterion (origination-proxy vs reporting grade)
  sicr_pd_ratio: 2.0                   # illustrative relative criterion
  sicr_abs_pd_min: 0.05                # illustrative absolute backstop used with the ratio test

floors:                                # para 82(3)(x), unsecured retail
  stage1: 0.01
  stage2: 0.05
  stage3_0_1y: 0.25
  stage3_after_1y: 1.00

scenarios:                             # ILLUSTRATIVE; para 48 requires multiple scenarios
  base:     {weight: 0.60, pd_scalar: 1.00}
  upside:   {weight: 0.15, pd_scalar: 0.85}
  downside: {weight: 0.25, pd_scalar: 1.35}
