# LLM provider settings. Default mode is dry-run: no API calls, zero cost.
mode: dry-run                  # dry-run | gemini | ollama
max_critic_iterations: 2

gemini:
  # Model IDs verified against https://ai.google.dev/gemini-api/docs/models on 2026-10-18.
  # Both are stable models already in use in the author's other projects.
  test_model: gemini-3.5-flash-lite
  final_model: gemini-3.6-flash
  use: test                    # test | final
  temperature: 0.2

ollama:
  host: http://localhost:11434
  model: llama3.1:8b

# USD per 1M tokens, paid tier, prompts <= 200k tokens.
# Source: https://ai.google.dev/gemini-api/docs/pricing, checked 2026-10-18.
cost_per_million:
  gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
  # gemini-3.6-flash rises to {input: 1.50, output: 7.50} from 2027-01-01; update this before any 2027 run.
  gemini-3.6-flash: {input: 0.75, output: 3.75}
  dry-run: {input: 0.0, output: 0.0}
  ollama: {input: 0.0, output: 0.0}

# Pre-flight cost estimate (`acr estimate-cost`): input tokens come from a dry-run's actual
# prompts; output tokens per call are assumed below (dry-run outputs are shorter than real ones).
estimate:
  output_tokens_per_call: {critic: 900, document: 450}
  uncertainty: 0.30            # report a +/- 30% band: tokenisers and response lengths vary
