# LLM provider settings. Default mode is dry-run: no API calls, zero cost.
mode: dry-run                  # dry-run | gemini | ollama
max_critic_iterations: 2

gemini:
  # Model IDs verified against https://ai.google.dev/gemini-api/docs/models on 2026-10-18.
  test_model: gemini-3.1-flash-lite
  final_model: gemini-3.1-pro-preview
  use: test                    # test | final
  temperature: 0.2

ollama:
  host: http://localhost:11434
  model: llama3.1:8b

# USD per 1M tokens, paid tier, prompts <= 200k tokens.
# Source: https://ai.google.dev/gemini-api/docs/pricing, checked 2026-10-18.
cost_per_million:
  gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
  gemini-3.1-pro-preview: {input: 2.00, output: 12.00}
  dry-run: {input: 0.0, output: 0.0}
  ollama: {input: 0.0, output: 0.0}
